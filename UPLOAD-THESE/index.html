PASTE THIS INSIDE THE <head> OF  UPLOAD-THESE/index.html
Put it as the FIRST thing inside <head>, before any other tag.

<script>
  /* Send every fresh arrival through the title card once, then let them in.
     The ?e=1 flag is what stops it looping back on itself. */
  (function () {
    try {
      var p = new URLSearchParams(window.location.search);
      var entered = p.get("e") === "1";
      var deep = window.location.hash && window.location.hash !== "#" && window.location.hash !== "#/";
      if (!entered && !deep) {
        window.location.replace("intro.html");
      }
    } catch (e) {}
  })();
</script>
